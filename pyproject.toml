[project]
name = "pawn"
version = "0.2.0"
description = "PAWN: Playstyle-Agnostic World-model Network for Chess"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "chess-engine",
    "numpy~=2.2.0",
    "psutil>=5.9.0",
    "safetensors>=0.4.0",
    "tqdm~=4.67.0",
    "huggingface-hub>=0.20.0",
    # JAX framework core. `jax` 0.10.0 + `jaxlib` 0.10.0 pinned explicitly
    # here so a future `uv lock` regeneration without a GPU extra can't float
    # jaxlib to 0.10.1+ and break the plugin (jax-rocm7-plugin 0.10.0
    # requires jaxlib 0.10.0; jaxlib 0.10.1 calls a `_triton.registrations()`
    # symbol the 0.10.0 plugin doesn't expose). The GPU device plugin
    # (jax-rocm7-plugin / jax-cuda12-plugin) lives in the `rocm` / `cu128`
    # extras. Bump all three pins in lockstep when 0.10.1+ ships.
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "equinox>=0.13.0",
    "optax>=0.2.5",
    # Config + templating + structured logging
    "pydantic>=2.13.0",
    "jinja2>=3.1.0",
    # Eval + probes + Lichess parquet data path (load-bearing per plan §12)
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "zstandard>=0.22.0",
    # Sweeps (Optuna is core; optuna-dashboard is in the `dashboard` extra)
    "optuna>=4.0.0",
    # Dev tooling
    "pyright>=1.1.0",
    "pytest~=9.0.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.7.0",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
# GPU backends — each adds the JAX device plugin AND torch (torch is only used
# by pawn.legacy, the v1-checkpoint compatibility loader; tests for the
# converter require it). The two GPU extras are mutually exclusive.
rocm = [
    "torch~=2.10.0",
    "triton-rocm>=3.6.0",
    "triton>=3.6.0",
    # JAX-on-ROCm: system ROCm 7.x runtime + plugin from PyPI.
    "jaxlib==0.10.0",
    "jax-rocm7-plugin==0.10.0",
]
cu128 = [
    "torch~=2.10.0",
    "jaxlib==0.10.0",
    "jax-cuda12-plugin[with-cuda]==0.10.0",
]
# Solara dashboard for log inspection.
dashboard = [
    "solara>=1.0.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "anywidget>=0.9.21",
    "starlette<1.0.0",  # solara/fastmcp incompatible with starlette 1.0
    "optuna-dashboard>=0.17.0",
]
# pawn-lab MCP server.
lab = [
    "fastmcp>=2.0.0",
    "starlette<1.0.0",  # solara/fastmcp incompatible with starlette 1.0
]
# Optional Weights & Biases metric mirror.
wandb = [
    "wandb~=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawn"]

[tool.uv.workspace]
members = ["engine"]

[tool.uv]
conflicts = [
    [
        { extra = "rocm" },
        { extra = "cu128" },
    ],
]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
chess-engine = { workspace = true }
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cu128", extra = "cu128" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportMissingImports = "error"
include = ["pawn", "scripts", "tests"]
# Excludes:
#   - pawn/dashboard: Solara widgets pyright can't follow.
#   - scripts/vastai_score.py: PEP 723 uv-shebang script — its deps
#     (requests, beautifulsoup4) are declared in-script via the
#     `# /// script` block and resolved by uv at execution time;
#     pyright doesn't see them.
exclude = ["pawn/dashboard", "scripts/vastai_score.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-function / no-I/O tests",
    "integration: multi-module flows, may touch filesystem",
    "smoke: end-to-end sanity checks (import + minimal execution)",
    "slow: tests that take >5s (excluded from default CI)",
    "gpu: tests that require a CUDA/ROCm GPU",
    "known_bug: tests that document a currently-broken behavior (paired with xfail)",
]
